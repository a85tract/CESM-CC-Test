name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n tools/*.sh hooks/pre-push hpc/*.pbs tests/*.sh
      - name: ShellCheck
        run: shellcheck tools/*.sh hooks/pre-push tests/*.sh
      - name: Integration tests
        run: tests/run.sh
