# ---------------------------------------------------------------------------
# Acceptance criteria. The example below is the bitwise shape used by
# Pipeline 1; delete it and use the statistical shape for Pipeline 2 once
# decision D4 settles that vocabulary.
#
# Every rule needs an explicit `gating`. A rule that is measured but does not
# gate still belongs here with `gating: false` — that is how the evidence
# records "we looked at this and chose not to block on it", rather than leaving
# the reader to guess what the PASS covered.
# ---------------------------------------------------------------------------
acceptance:
  kind: bitwise
  rules:
    - check: file_set_equal
      scope: "*.cam.{h0,r,rh0,rs}.*.nc"
      gating: true          # always true — a mismatch means nothing was compared

    - check: numeric_md5_equal
      scope: "*.cam.{h0,r,rh0,rs}.*.nc"
      dump_format: "%+.17g" # the digest is only comparable at the same format
      dump_tool: ncks
      gating: true

    - check: char_diff_count
      expect: 0
      gating: false
      note: "character variables carry timestamps and case names; reported, not gated"

    - check: timing_delta_pct
      timers: [physpkg_st1, bc_physics, "CPL:RUN_LOOP"]
      gating: false
      note: "performance is reported alongside correctness and never gates it"
      # If you do set gating: true here, max_abs_pct becomes required — a gating
      # rule with no bound cannot reach a verdict.
