# The `acceptance` block must validate against ../schemas/acceptance.v1.json.

id: TODO-case-id            # must equal this file's stem
product: TODO               # pycam5 | freecam | clubb-jax | clm-ml-jax | elm-jax
description: TODO           # one line, shown in the generated evidence index

case:
  compset: TODO
  resolution: TODO
  duration: TODO            # e.g. "6 months"
  ranks: TODO               # integer
  # Anything else needed to reproduce the run — env file, SourceMods, input data set.
  notes: TODO

